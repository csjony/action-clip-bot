# =============================================================================
# Video-generation providers + fallback chain.
# Currently configured for Local/RunPod Cloud GPU video generator running Wan 2.2.
# =============================================================================

order:
  - local
  - colab

providers:
  local:
    enabled: true
    free: true
    model: "wan2.2-5b"
    watermark_free: true
    aspect: "16:9"
    env_key: LOCAL_GENERATOR_URL
    credits:
      kind: daily
      cap: 1000000
  colab:
    enabled: true
    free: true
    model: "wan2.2-14b"
    watermark_free: true
    aspect: "16:9"
    env_key: COLAB_TUNNEL_URL
    credits:
      kind: daily
      cap: 1000000
